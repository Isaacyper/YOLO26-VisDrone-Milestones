# Ultralytics YOLO26 Direction-4+6 fusion model for efficient small-object detection on VisDrone2019-DET

nc: 10
end2end: True
reg_max: 1
scale: n
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

# FBRT-style lightweight backbone. The semantic split is high in shallow stages and low in deep stages.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 1, FeatureComplementaryMapping, [128, 0.75]] # 2-P2/4
  - [-1, 1, EfficientDown, [256]] # 3-P3/8
  - [-1, 1, FeatureComplementaryMapping, [256, 0.75]] # 4-P3/8
  - [-1, 1, EfficientDown, [512]] # 5-P4/16
  - [-1, 1, FeatureComplementaryMapping, [512, 0.25]] # 6-P4/16
  - [-1, 1, MultiKernelPerception, [512]] # 7-P4/16
  - [-1, 1, FeatureComplementaryMapping, [512, 0.25]] # 8-P4/16
  - [-1, 1, SPPF, [512, 5, 3, True]] # 9-P4/16

# P2 participates in feature fusion, while prediction remains on P3/P4 to control anchors and inference cost.
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 4], 1, Concat, [1]] # 11-P3 fusion
  - [-1, 2, C3k2, [256, True]] # 12-P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 2], 1, Concat, [1]] # 14-P2 fusion
  - [-1, 1, C3k2, [128, True]] # 15-P2/4 enriched shallow feature

  - [-1, 1, EfficientDown, [256]] # 16
  - [[-1, 12], 1, Concat, [1]] # 17
  - [-1, 2, C3k2, [256, True]] # 18-P3/8-small

  - [-1, 1, EfficientDown, [512]] # 19
  - [[-1, 9], 1, Concat, [1]] # 20
  - [-1, 2, C3k2, [512, True]] # 21-P4/16-medium

  - [[18, 21], 1, Direction4Detect, [nc, 64, 1, True]] # Detect(P3, P4)
